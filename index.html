<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnfollowApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">UnfollowApp</h1>
        <p style="text-align: center;">Sube tus archivos JSON de Instagram</p>
        
        <div class="upload-section">
            <label id="zipLabel">Archivo exportado (.zip):</label>
            <input type="file" id="zipInput" accept=".zip">
        </div>

        <button id="analyzeBtn">Extraer y Analizar Datos</button>

        <div id="result" class="hidden">
            <div class="counter-badge">
                <span id="totalCount">0</span> personas no te siguen de vuelta
            </div>
            <h2>Lista de usuarios:</h2>
            <ul id="list"></ul>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
